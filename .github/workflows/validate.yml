name: validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile Python (syntax check)
        run: python -m compileall -q scripts src

      - name: Validate example config (structure only)
        run: python scripts/validate_config.py config/settings.example.yaml --structure-only
